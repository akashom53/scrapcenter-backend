<div class="main-content">
    <div class="page-header">
        <h1>Dashboard</h1>
        <div class="actions">
            <button class="primary-button" (click)="handleNewClick()">
                <i class="fa fa-plus"></i> New Scrap Request
            </button>
        </div>
    </div>

    <div class="dashboard-stats">
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa fa-car"></i>
            </div>
            <div class="stat-details">
                <h3>3</h3>
                <p>Active Requests</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa fa-check-circle"></i>
            </div>
            <div class="stat-details">
                <h3>12</h3>
                <p>Completed Scraps</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa fa-money"></i>
            </div>
            <div class="stat-details">
                <h3>£2,450</h3>
                <p>Total Earnings</p>
            </div>
        </div>
    </div>

    <app-leads-table [leads]="leads" [headerData]="header"></app-leads-table>
</div>
