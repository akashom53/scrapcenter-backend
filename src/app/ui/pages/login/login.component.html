<div class="login-container">
    <div class="login-card">
        <div class="left-panel">
            <div class="quote-section">
                <div class="quote-label">A WISE QUOTE</div>
                <h1 class="headline">Get<br>Everything<br>You Want</h1>
                <p class="quote-text">
                    You can get everything you want if you work hard,
                    trust the process, and stick to the plan.
                </p>
            </div>
        </div>
        <div class="right-panel">
            <div class="logo-section">
                <div class="logo">Scrapcenter</div>
            </div>
            <div class="login-form">
                <h2 class="welcome-text">Welcome Back</h2>
                <p class="login-description">Enter your email and password to access your account</p>

                <form (ngSubmit)="onSubmit()">
                    <!-- Error message display -->
                    <div class="error-message" *ngIf="errorMessage">
                        {{ errorMessage }}
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" placeholder="Enter your password">
                            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
                                <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember" [(ngModel)]="rememberMe" name="rememberMe">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password</a>
                    </div>

                    <button type="submit" class="sign-in-btn" [disabled]="isLoading">
                        <span *ngIf="!isLoading">Sign In</span>
                        <span *ngIf="isLoading">Signing in...</span>
                    </button>

                    <button type="button" class="google-btn" (click)="loginWithGoogle()">
                        <i class="fa-brands fa-google"></i>
                        Sign In with Google
                    </button>
                </form>

                <div class="signup-prompt">
                    Don't have an account? <a href="#" class="sign-up-link">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>
<p>login works!</p>
