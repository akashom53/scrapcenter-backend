<div class="login-container"> <!-- You can rename this class to signup-container or keep it for similar styling -->
    <div class="login-card"> <!-- You can rename this class to signup-card or keep it for similar styling -->
        <div class="left-panel">
            <div class="quote-section">
                <div class="quote-label">A NEW START</div>
                <h1 class="headline">Create<br>Your<br>Account</h1>
                <p class="quote-text">
                    Embark on your journey with us. Create an account to get started.
                </p>
            </div>
        </div>
        <div class="right-panel">
            <div class="logo-section">
                <div class="logo">Scrapcenter</div>
            </div>
            <div class="login-form"> <!-- You can rename this class to signup-form or keep it for similar styling -->
                <h2 class="welcome-text">Create Account</h2>
                <p class="login-description">Enter your details to create your account</p>

                <form (ngSubmit)="onSubmit()">
                    <div class="error-message" *ngIf="errorMessage">
                        {{ errorMessage }}
                    </div>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" [(ngModel)]="name" name="name" placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password"
                                name="password" placeholder="Enter your password">
                            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
                                <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-input">
                            <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword"
                                [(ngModel)]="confirmPassword" name="confirmPassword"
                                placeholder="Confirm your password">
                            <button type="button" class="toggle-password" (click)="toggleConfirmPasswordVisibility()">
                                <i class="fa" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="sign-in-btn" [disabled]="isLoading">
                        <span *ngIf="!isLoading">Sign Up</span>
                        <span *ngIf="isLoading">Signing up...</span>
                    </button>
                </form>

                <div class="signup-prompt">
                    Already have an account? <a href="/login" class="sign-up-link">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
<p>signup works!</p>
