<!-- Vehicle Images Upload Section -->
<div class="form-group">
    <label for="vehicleImages">Vehicle Images</label>
    <div class="file-upload-container">
        <input type="file" #inputImage id="vehicleImages" class="file-input" multiple accept="image/*"
            (change)="onFileSelected($event)" />
        <div class="file-upload-area" (click)="inputImage.click()">
            <div class="upload-icon">
                <mat-icon>cloud_upload</mat-icon>
            </div>
            <div class="upload-text">
                <p><strong>Click to upload</strong> or drag and drop</p>
                <p class="upload-hint">PNG, JPG, JPEG up to 10MB each (Max 5 images)</p>
            </div>
        </div>

        <!-- Display selected files -->
        <div class="uploaded-files" *ngIf="selectedFiles.length > 0">
            <div class="file-preview" *ngFor="let file of selectedFiles; let i = index">
                <div class="file-info">
                    <mat-icon>image</mat-icon>
                    <span class="file-name">{{ file.name }}</span>
                    <span class="file-size">({{ (file.size / 1024 / 1024).toFixed(2) }} MB)</span>
                </div>
                <button type="button" class="remove-file" (click)="removeFile(i)" mat-icon-button>
                    <mat-icon>close</mat-icon>
                </button>
            </div>
        </div>

        <!-- Upload error message -->
        <div class="upload-error" *ngIf="uploadStatus.error">
            <mat-icon>error</mat-icon>
            <span>{{ uploadStatus.error }}</span>
        </div>
    </div>
</div>
